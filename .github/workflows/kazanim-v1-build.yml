name: Build Kazanim v2 APK

on:
  push:
    branches:
      - kazanim-v1-build-20260909
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and unpack v2 project
        shell: bash
        run: |
          cat .ci/kazanim_v2_b64/part-01 .ci/kazanim_v2_b64/part-02 .ci/kazanim_v2_b64/part-03 .ci/kazanim_v2_b64/part-04 .ci/kazanim_v2_b64/part-05 | base64 --decode > Kazanim_v2_Kaynak.zip
          unzip -t Kazanim_v2_Kaynak.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Kazanim_v2_Kaynak.zip -d buildsrc
          test -f buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'versionName = "2"' buildsrc/Kazanim_v2/app/build.gradle.kts

      - name: Build debug APK
        working-directory: buildsrc/Kazanim_v2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: cp buildsrc/Kazanim_v2/app/build/outputs/apk/debug/app-debug.apk Kazanim-v2-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s Kazanim-v2-debug.apk
          file Kazanim-v2-debug.apk
          unzip -t Kazanim-v2-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazanim-v2-debug-apk
          path: Kazanim-v2-debug.apk
          if-no-files-found: error
          retention-days: 7
