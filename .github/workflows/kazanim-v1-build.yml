name: Build Kazanim v8.2 APK

on:
  push:
    branches:
      - kazanim-v1-build-20260909
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 and RAR support
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -y
          sudo apt-get install -y unrar-free

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v2 base
        shell: bash
        run: |
          cat .ci/kazanim_v2_b64/part-01 .ci/kazanim_v2_b64/part-02 .ci/kazanim_v2_b64/part-03 .ci/kazanim_v2_b64/part-04 .ci/kazanim_v2_b64/part-05 | base64 --decode > Kazanim_v2_Kaynak.zip
          unzip -t Kazanim_v2_Kaynak.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Kazanim_v2_Kaynak.zip -d buildsrc
          test -f buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java

      - name: Generate Kazanim v3 base
        shell: bash
        run: |
          python .ci/build_kazanim_v3.py buildsrc/Kazanim_v2
          python - <<'PY'
          from pathlib import Path
          p=Path("buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java")
          s=p.read_text(encoding="utf-8")
          if "private void addHorizontalSpace" not in s:
              marker="    private void addSpace(LinearLayout parent, int valueDp) {"
              helper="    private void addHorizontalSpace(LinearLayout parent, int valueDp) {\n        Space gap = new Space(this);\n        parent.addView(gap, new LinearLayout.LayoutParams(dp(valueDp), 1));\n    }\n\n"
              if marker not in s:
                  raise SystemExit("addSpace marker not found")
              s=s.replace(marker, helper+marker)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Generate Kazanim v4
        shell: bash
        run: |
          python .ci/build_kazanim_v4.py buildsrc/Kazanim_v2
          grep -q 'versionName = "4"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 4' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json

      - name: Generate Kazanim v5
        shell: bash
        run: |
          python .ci/build_kazanim_v5.py buildsrc/Kazanim_v2
          grep -q 'versionName = "5"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 5' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"tdb1-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"tdb2-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"health-9"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json

      - name: Generate and validate Kazanim v6
        shell: bash
        run: |
          python .ci/v6_hint_engine.py buildsrc/Kazanim_v2
          python .ci/v6_ui_patch.py buildsrc/Kazanim_v2
          grep -q 'versionName = "6"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 6' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q 'createHintPanel' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          python - <<'PY'
          import json
          p="buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json"
          d=json.load(open(p,encoding="utf-8"))
          hint_pages=[]
          for g in d["grades"]:
              for c in g["courses"]:
                  for page in c["pages"]:
                      if "hints" in page:
                          hint_pages.append((g["grade"],c["subjectId"],page))
          assert len(hint_pages)==102, len(hint_pages)
          assert all(g in (9,10,11) and sid=="dkab" for g,sid,_ in hint_pages)
          for _,_,page in hint_pages:
              plans=page["hints"]["plans"]
              assert len(plans)==2
              assert plans[0]["style"] != plans[1]["style"]
              for plan in plans:
                  assert 1 <= len(plan["blocks"]) <= 3
                  assert sum(b["minutes"] for b in plan["blocks"]) == 30
                  assert min(b["minutes"] for b in plan["blocks"]) >= 5
                  assert all(b["title"].strip() and b["text"].strip() for b in plan["blocks"])
          print("v6 hint validation OK:",len(hint_pages))
          PY

      - name: Generate and validate Kazanim v7
        shell: bash
        run: |
          python .ci/v7_grade10_curated.py buildsrc/Kazanim_v2
          grep -q 'versionName = "7"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 7' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q 'curated-official-2026' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '10. sınıf • TYMM temelli' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q 'hintSubtitle' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          python - <<'PY'
          import json
          p="buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json"
          d=json.load(open(p,encoding="utf-8"))
          g=next(x for x in d["grades"] if x["grade"]==10)
          c=next(x for x in g["courses"] if x["subjectId"]=="dkab")
          pages=[x for x in c["pages"] if x.get("type")=="week" and x.get("outcome")]
          assert len(pages)==34
          assert all(x["hints"]["qualityLevel"]=="curated-official-2026" for x in pages)
          assert all(len(x["hints"]["plans"])==2 for x in pages)
          assert all(sum(b["minutes"] for b in plan["blocks"])==30 for x in pages for plan in x["hints"]["plans"])
          assert all(min(b["minutes"] for b in plan["blocks"])>=5 for x in pages for plan in x["hints"]["plans"])
          print("v7 grade10 validation OK:",len(pages))
          PY

      - name: Generate and validate Kazanim v8
        shell: bash
        run: |
          python .ci/build_kazanim_v8.py buildsrc/Kazanim_v2
          grep -q 'versionName = "8"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 8' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"science-5"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"science-8"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"social-5"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"social-8"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q 'T.C. İnkılap Tarihi ve Atatürkçülük' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"science", "social"' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          python - <<'PY'
          import json
          p="buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json"
          d=json.load(open(p,encoding="utf-8"))
          total=0
          for grade in (5,6,7,8):
              g=next(x for x in d["grades"] if x["grade"]==grade)
              for sid in ("science","social"):
                  c=next(x for x in g["courses"] if x["subjectId"]==sid)
                  pages=[x for x in c["pages"] if x.get("type")=="week" and x.get("outcome")]
                  assert 30 <= len(pages) <= 36, (grade,sid,len(pages))
                  for x in pages:
                      h=x.get("hints")
                      assert h and len(h["plans"])==2
                      for plan in h["plans"]:
                          assert sum(b["minutes"] for b in plan["blocks"])==30
                          assert min(b["minutes"] for b in plan["blocks"])>=5
                  total += len(pages)
          assert total >= 250, total
          s8=next(c for g in d["grades"] if g["grade"]==8 for c in g["courses"] if c["subjectId"]=="social")
          assert s8["subjectName"]=="T.C. İnkılap Tarihi ve Atatürkçülük"
          print("v8 middle-school validation OK:", total)
          PY

      - name: Apply and validate Kazanim v8.1
        shell: bash
        run: |
          cat .ci/kazanim_v8_1_b64/part-01 .ci/kazanim_v8_1_b64/part-02 .ci/kazanim_v8_1_b64/part-03 .ci/kazanim_v8_1_b64/part-04 .ci/kazanim_v8_1_b64/part-05 | base64 --decode > /tmp/kazanim-v8.1-overlay.zip
          unzip -t /tmp/kazanim-v8.1-overlay.zip
          unzip -oq /tmp/kazanim-v8.1-overlay.zip -d buildsrc/Kazanim_v2
          grep -q 'versionName = "8.1"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q 'versionCode = 9' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q 'private enum Screen { HOME, SCHEDULE, SUBJECT, FAVORITES, COURSE }' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'geçen haftadan not var' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'Kalıcı Not' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'Ders Programı' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'LessonWidgetProvider' buildsrc/Kazanim_v2/app/src/main/AndroidManifest.xml
          test -f buildsrc/Kazanim_v2/app/src/main/res/layout/widget_lesson.xml
          test -f buildsrc/Kazanim_v2/app/src/main/res/xml/lesson_widget_info.xml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path("buildsrc/Kazanim_v2")
          main=(root/"app/src/main/java/com/kazanim/app/MainActivity.java").read_text(encoding="utf-8")
          i1=main.index('⌂\\nAna Sayfa')
          i2=main.index('▦\\nDers Programı')
          i3=main.index('★\\nFavoriler')
          assert i1 < i2 < i3
          assert 'createWeeklyNotePanel(page)' in main
          assert 'renderPersistentNotePanel()' in main
          assert 'ScheduleStore.putEntry' in main
          assert 'LessonWidgetProvider.refreshAll' in main
          manifest=root/"app/src/main/AndroidManifest.xml"
          ET.parse(manifest)
          for p in [
              root/"app/src/main/res/layout/widget_lesson.xml",
              root/"app/src/main/res/drawable/widget_bg.xml",
              root/"app/src/main/res/drawable/widget_class_bg.xml",
              root/"app/src/main/res/xml/lesson_widget_info.xml",
          ]:
              ET.parse(p)
          print("v8.1 navigation / notes / schedule / widget validation OK")
          PY

      - name: Apply and validate Kazanim v8.2
        shell: bash
        run: |
          python .ci/v8_2_patch.py buildsrc/Kazanim_v2
          grep -q 'versionName = "8.2"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q 'versionCode = 10' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q 'showWheelTimePicker' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'NumberPicker' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'scheduleCourses' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          grep -q 'windowSoftInputMode="adjustResize"' buildsrc/Kazanim_v2/app/src/main/AndroidManifest.xml
          ! grep -q 'Önceki hafta' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          ! grep -q 'Sonraki hafta' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          ! grep -q 'Hafta değişse de burada kalır' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("buildsrc/Kazanim_v2")
          d=json.load(open(root/"app/src/main/assets/curriculum_2026_2027.json",encoding="utf-8"))
          for grade in (9,10):
              g=next(x for x in d["grades"] if x["grade"]==grade)
              c=next(x for x in g["courses"] if x.get("subjectId")=="english")
              assert len([p for p in c["pages"] if p.get("type")=="week"])==37
          main=(root/"app/src/main/java/com/kazanim/app/MainActivity.java").read_text(encoding="utf-8")
          assert 'englishExpandable' in main
          assert 'englishOutcome' in main
          assert 'setMaxLines(2)' in main
          assert 'Kalıcı Not", 19' in main
          assert 'edit.setTextSize(16.5f)' in main
          assert 'if (isFavorite(c)) scheduleCourses.add(c)' in main
          print("v8.2 English / notes / wheel time / favorites validation OK")
          PY

      - name: Build debug APK
        working-directory: buildsrc/Kazanim_v2
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../../v8.2-build.log

      - name: Prepare APK
        run: cp buildsrc/Kazanim_v2/app/build/outputs/apk/debug/app-debug.apk Kazanim-v8.2-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s Kazanim-v8-debug.apk
          file Kazanim-v8-debug.apk
          unzip -t Kazanim-v8-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazanim-v8.2-debug-apk
          path: Kazanim-v8-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kazanim-v8.2-build-log
          path: v8.2-build.log
          if-no-files-found: ignore
          retention-days: 3
