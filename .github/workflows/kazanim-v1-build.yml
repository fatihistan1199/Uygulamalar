name: Build Kazanim v4 APK

on:
  push:
    branches:
      - kazanim-v1-build-20260909
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 and RAR support
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -y
          sudo apt-get install -y unrar-free

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v2 base
        shell: bash
        run: |
          cat .ci/kazanim_v2_b64/part-01 .ci/kazanim_v2_b64/part-02 .ci/kazanim_v2_b64/part-03 .ci/kazanim_v2_b64/part-04 .ci/kazanim_v2_b64/part-05 | base64 --decode > Kazanim_v2_Kaynak.zip
          unzip -t Kazanim_v2_Kaynak.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Kazanim_v2_Kaynak.zip -d buildsrc
          test -f buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java

      - name: Generate Kazanim v3 base
        shell: bash
        run: |
          python .ci/build_kazanim_v3.py buildsrc/Kazanim_v2
          python - <<'PY'
          from pathlib import Path
          p=Path("buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java")
          s=p.read_text(encoding="utf-8")
          if "private void addHorizontalSpace" not in s:
              marker="    private void addSpace(LinearLayout parent, int valueDp) {"
              helper="    private void addHorizontalSpace(LinearLayout parent, int valueDp) {\n        Space gap = new Space(this);\n        parent.addView(gap, new LinearLayout.LayoutParams(dp(valueDp), 1));\n    }\n\n"
              if marker not in s:
                  raise SystemExit("addSpace marker not found")
              s=s.replace(marker, helper+marker)
              p.write_text(s, encoding="utf-8")
          PY
          grep -q 'versionName = "3"' buildsrc/Kazanim_v2/app/build.gradle.kts

      - name: Generate Kazanim v4
        shell: bash
        run: |
          python .ci/build_kazanim_v4.py buildsrc/Kazanim_v2
          grep -q 'versionName = "4"' buildsrc/Kazanim_v2/app/build.gradle.kts
          grep -q '"schemaVersion": 4' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"tde-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"physics-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"chemistry-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"biology-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"geography-12"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q '"philosophy-11"' buildsrc/Kazanim_v2/app/src/main/assets/curriculum_2026_2027.json
          grep -q 'Türk Dili ve Edebiyatı' buildsrc/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java

      - name: Build debug APK
        working-directory: buildsrc/Kazanim_v2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: cp buildsrc/Kazanim_v2/app/build/outputs/apk/debug/app-debug.apk Kazanim-v4-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s Kazanim-v4-debug.apk
          file Kazanim-v4-debug.apk
          unzip -t Kazanim-v4-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazanim-v4-debug-apk
          path: Kazanim-v4-debug.apk
          if-no-files-found: error
          retention-days: 7
