name: Gundem Radari Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'gundem-radari-android/**'
      - '.github/workflows/build-gundem-radari-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gundem-radari-android
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Android 35 bileşenlerini kur
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Debug APK olustur
        run: gradle :app:assembleDebug --no-daemon
      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: GundemRadari-debug-apk
          path: gundem-radari-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
