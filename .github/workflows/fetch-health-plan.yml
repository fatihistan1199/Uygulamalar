name: Fetch health annual plan
on:
  workflow_dispatch:
  push:
    branches: [kazanim-v1-build-20260909]
    paths:
      - .github/workflows/fetch-health-plan.yml
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current health plan page
        shell: bash
        run: |
          set -e
          curl -k -L -A "Mozilla/5.0" "https://biyolojihikayesi.com/dokumanlar.php" -o health_page.html
          python - <<'PY'
          import re,html
          txt=open('health_page.html',encoding='utf-8',errors='ignore').read()
          print('LEN',len(txt))
          for m in re.finditer(r'Sağlık Bilgisi|Saglik Bilgisi|saglik',txt,re.I):
              print('CTX',txt[max(0,m.start()-1400):m.start()+2600].replace('\n',' ')[:5000])
          for href,body in re.findall(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',txt,re.I|re.S):
              label=re.sub('<[^>]+>',' ',body)
              label=re.sub(r'\s+',' ',html.unescape(label)).strip()
              if 'sağlık' in label.lower() or 'saglik' in label.lower() or 'yıllık' in label.lower():
                  print('LINK',label[:300],'=>',html.unescape(href))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: health-page
          path: health_page.html
          retention-days: 1
