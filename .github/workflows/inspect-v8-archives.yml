name: Inspect v8 official archives
on:
  workflow_dispatch:
  push:
    branches: [kazanim-v1-build-20260909]
    paths:
      - .github/workflows/inspect-v8-archives.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, zipfile, io, os, re, html
          from xml.etree import ElementTree as ET
          urls={
            'fen':'https://tymm.meb.gov.tr/assets/file/fen-bilimleri-dersi-taslak-yillik-planlar_20260903_122025_920.zip',
            'sos':'https://tymm.meb.gov.tr/assets/file/sosyal-bilgiler-dersi-yillik-planlar_20260903_120026_880.zip',
            'ita':'https://tymm.meb.gov.tr/assets/file/tc-inkilap-tarihi-ve-ataturkculuk-dersi-taslak-yillik-planlar_20260903_120043_922.zip',
          }
          NS={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main',
              'r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
              'rel':'http://schemas.openxmlformats.org/package/2006/relationships'}
          def col(cell):
              m=re.match(r'([A-Z]+)',cell)
              return m.group(1) if m else ''
          def xlsx_summary(data,name):
              z=zipfile.ZipFile(io.BytesIO(data))
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('m:si',NS):
                      shared.append(''.join(t.text or '' for t in si.findall('.//m:t',NS)))
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              relroot=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              relmap={r.attrib['Id']:r.attrib['Target'] for r in relroot}
              for sh in wb.find('m:sheets',NS):
                  sname=sh.attrib['name']; rid=sh.attrib['{'+NS['r']+'}id']; target=relmap[rid]
                  path='xl/'+target if not target.startswith('/') else target.lstrip('/')
                  root=ET.fromstring(z.read(path))
                  print('SHEET',name,sname)
                  for row in root.findall('.//m:sheetData/m:row',NS)[:20]:
                      vals=[]
                      for c in row.findall('m:c',NS):
                          ref=c.attrib.get('r',''); typ=c.attrib.get('t'); v=c.find('m:v',NS)
                          if v is None: continue
                          val=v.text or ''
                          if typ=='s':
                              try: val=shared[int(val)]
                              except: pass
                          vals.append(f"{ref}:{val}")
                      if vals: print('ROW',row.attrib.get('r'), ' | '.join(vals[:12]))
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=60).read()
              print('ARCHIVE',key,len(data))
              z=zipfile.ZipFile(io.BytesIO(data))
              for n in z.namelist():
                  print('FILE',key,n)
                  if n.lower().endswith('.xlsx'):
                      try: xlsx_summary(z.read(n),key+'/'+n)
                      except Exception as e: print('XLSXERR',n,repr(e))
          PY
