name: Build Kazanim v2 APK

on:
  push:
    branches:
      - kazanim-v2-build-20260909
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source
        shell: bash
        run: |
          cat .ci/kazanim_v2/part-00 .ci/kazanim_v2/part-01 .ci/kazanim_v2/part-02 .ci/kazanim_v2/part-03 .ci/kazanim_v2/part-04 .ci/kazanim_v2/part-05 | base64 --decode > Kazanim_v2.zip
          unzip -t Kazanim_v2.zip
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q Kazanim_v2.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/Kazanim_v2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: cp buildsrc/Kazanim_v2/app/build/outputs/apk/debug/app-debug.apk Kazanim-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kazanim-v2-apk
          path: Kazanim-v2.apk
          if-no-files-found: error
          retention-days: 7
