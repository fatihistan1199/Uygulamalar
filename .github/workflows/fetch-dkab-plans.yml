name: Fetch official DKAB plans
on:
  workflow_dispatch:
  push:
    branches:
      - kazanim-v1-build-20260909
    paths:
      - .github/workflows/fetch-dkab-plans.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MEB plans
        shell: bash
        run: |
          set -e
          mkdir -p official_plans
          curl -fL --retry 3 --retry-delay 2 "https://dogm.meb.gov.tr/Programlar/CerceveYillikPlan/DKAB/2026-2027dkab9_TYMM.xlsx" -o official_plans/dkab9.xlsx
          curl -fL --retry 3 --retry-delay 2 "https://dogm.meb.gov.tr/Programlar/CerceveYillikPlan/DKAB/2026-2027dkab11_TYMM.xlsx" -o official_plans/dkab11.xlsx
          curl -fL --retry 3 --retry-delay 2 "https://dogm.meb.gov.tr/Programlar/CerceveYillikPlan/DKAB/2026-2027dkab12.xlsx" -o official_plans/dkab12.xlsx
          file official_plans/*
      - uses: actions/upload-artifact@v4
        with:
          name: official-dkab-plans
          path: official_plans/*.xlsx
          retention-days: 3
