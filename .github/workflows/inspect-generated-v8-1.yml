name: Inspect generated v8.1
on:
  workflow_dispatch:
  push:
    branches: [kazanim-v1-build-20260909]
    paths:
      - .github/workflows/inspect-generated-v8-1.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y unrar-free >/dev/null
      - name: Reconstruct current v8.1
        shell: bash
        run: |
          cat .ci/kazanim_v2_b64/part-01 .ci/kazanim_v2_b64/part-02 .ci/kazanim_v2_b64/part-03 .ci/kazanim_v2_b64/part-04 .ci/kazanim_v2_b64/part-05 | base64 --decode > base.zip
          mkdir src && unzip -q base.zip -d src
          python .ci/build_kazanim_v3.py src/Kazanim_v2
          python - <<'PY'
          from pathlib import Path
          p=Path("src/Kazanim_v2/app/src/main/java/com/kazanim/app/MainActivity.java")
          s=p.read_text(encoding="utf-8")
          if "private void addHorizontalSpace" not in s:
              marker="    private void addSpace(LinearLayout parent, int valueDp) {"
              helper="    private void addHorizontalSpace(LinearLayout parent, int valueDp) {\n        Space gap = new Space(this);\n        parent.addView(gap, new LinearLayout.LayoutParams(dp(valueDp), 1));\n    }\n\n"
              if marker in s:
                  s=s.replace(marker,helper+marker)
                  p.write_text(s,encoding="utf-8")
          PY
          python .ci/build_kazanim_v4.py src/Kazanim_v2
          python .ci/build_kazanim_v5.py src/Kazanim_v2
          python .ci/v6_hint_engine.py src/Kazanim_v2
          python .ci/v6_ui_patch.py src/Kazanim_v2
          python .ci/v7_grade10_curated.py src/Kazanim_v2
          python .ci/build_kazanim_v8.py src/Kazanim_v2
          cat .ci/kazanim_v8_1_b64/part-01 .ci/kazanim_v8_1_b64/part-02 .ci/kazanim_v8_1_b64/part-03 .ci/kazanim_v8_1_b64/part-04 .ci/kazanim_v8_1_b64/part-05 | base64 --decode > /tmp/kazanim-v8.1-overlay.zip
          unzip -oq /tmp/kazanim-v8.1-overlay.zip -d src/Kazanim_v2
      - name: Print targeted snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path("src/Kazanim_v2")
          p=root/"app/src/main/java/com/kazanim/app/MainActivity.java"
          s=p.read_text(encoding="utf-8")
          pats=[
            "private View createPageView",
            "createWeeklyNotePanel",
            "renderPersistentNotePanel",
            "renderSchedule",
            "showScheduleSettings",
            "showScheduleEntryDialog",
            "bottomNav",
            "renderSubject"
          ]
          for pat in pats:
              start=0
              while True:
                  i=s.find(pat,start)
                  if i<0: break
                  print("\n---",pat,"@",i,"---")
                  print(s[max(0,i-1200):min(len(s),i+12000)])
                  start=i+len(pat)
          j=json.load(open(root/"app/src/main/assets/curriculum_2026_2027.json",encoding="utf-8"))
          for grade in (9,10):
              g=next(x for x in j["grades"] if x["grade"]==grade)
              print("\nGRADE",grade,[(c["subjectId"],c.get("subjectName"),len(c.get("pages",[]))) for c in g["courses"]])
          PY
      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: generated-v8-1-source
          path: src/Kazanim_v2
          retention-days: 2
